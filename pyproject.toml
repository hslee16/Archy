[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archy"
version = "0.8.2"
description = "Architectural sensor for Python codebases"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Alex Lee" }]
keywords = ["architecture", "static-analysis", "tree-sitter", "dependency-graph"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "click>=8.1",
    "mcp>=1.27.1",
]

[project.optional-dependencies]
contracts = [
    # Wraps import-linter for `archy contracts` and the `archy_contracts`
    # MCP tool. Pinned to a single minor: the wrap depends on a non-public
    # entry point (`_register_contract_types`) and on the `UserOptions`
    # constructor shape, both of which can shift across minors. The
    # contract test in tests/test_contracts.py is the canary.
    "import-linter>=2.11,<2.12",
]

[project.scripts]
archy = "archy.cli:main"

[project.urls]
Homepage = "https://github.com/hslee16/archy"
Issues = "https://github.com/hslee16/archy/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "import-linter>=2.11,<2.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
