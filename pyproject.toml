[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archy"
version = "0.0.0"
description = "Architectural sensor for Python codebases"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Alex Lee" }]
keywords = ["architecture", "static-analysis", "tree-sitter", "dependency-graph"]
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
archy = "archy.cli:main"

[project.urls]
Homepage = "https://github.com/hslee16/archy"
Issues = "https://github.com/hslee16/archy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/archy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
