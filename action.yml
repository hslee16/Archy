name: archy
description: Run archy (architectural sensor) against a Python project. Supports score, check, and cycles.
author: archy

branding:
  icon: activity
  color: purple

inputs:
  command:
    description: archy subcommand to run. One of "score", "check", "cycles".
    required: false
    default: score
  path:
    description: Path to the Python project to analyze.
    required: false
    default: "."
  strict:
    description: For "score" and "cycles", pass --strict so the step fails on regression / cycles.
    required: false
    default: "true"
  strict-tolerance:
    description: Tolerance for "score --strict" (default 0.02).
    required: false
    default: "0.02"
  record:
    description: For "score", also append the result to .archy/history.jsonl.
    required: false
    default: "false"
  config:
    description: For "check", path to archy.yaml. Auto-discovered if empty.
    required: false
    default: ""
  python-version:
    description: Python version to install when running archy.
    required: false
    default: "3.10"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install archy
      shell: bash
      run: uv pip install --system "${{ github.action_path }}"

    - name: Run archy ${{ inputs.command }}
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.command }}" in
          score)
            args=("${{ inputs.path }}")
            if [[ "${{ inputs.strict }}" == "true" ]]; then
              args+=(--strict --strict-tolerance "${{ inputs.strict-tolerance }}")
            fi
            if [[ "${{ inputs.record }}" == "true" ]]; then
              args+=(--record)
            fi
            archy score "${args[@]}"
            ;;
          check)
            args=("${{ inputs.path }}")
            if [[ -n "${{ inputs.config }}" ]]; then
              args+=(--config "${{ inputs.config }}")
            fi
            archy check "${args[@]}"
            ;;
          cycles)
            args=("${{ inputs.path }}")
            if [[ "${{ inputs.strict }}" == "true" ]]; then
              args+=(--strict)
            fi
            archy cycles "${args[@]}"
            ;;
          *)
            echo "Unknown command: ${{ inputs.command }}" >&2
            exit 2
            ;;
        esac
