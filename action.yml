name: archy
description: Run archy (architectural sensor) against a Python project. Supports score, check, cycles, and diff.
author: archy

branding:
  icon: activity
  color: purple

inputs:
  command:
    description: archy subcommand to run. One of "score", "check", "cycles", "diff", "history".
    required: false
    default: score
  path:
    description: Path to the Python project to analyze.
    required: false
    default: "."
  strict:
    description: For "score", "cycles" and "diff", pass --strict so the step fails on regression / cycles / new findings.
    required: false
    default: "true"
  strict-tolerance:
    description: Tolerance for "score --strict" (default 0.02).
    required: false
    default: "0.02"
  record:
    description: For "score", also append the result to .archy/history.jsonl. For "history", record this commit's score on the history branch (run it on merges to the default branch only; a pull request never records).
    required: false
    default: "false"
  config:
    description: For "check", path to archy.yaml. Auto-discovered if empty.
    required: false
    default: ""
  baseline:
    description: For "diff", the committed baseline file, relative to the workflow's working directory. Create it with `archy snapshot <path> --findings-only --out <baseline>`, using the same `path` input.
    required: false
    default: "archy-baseline.json"
  history-branch:
    description: For "history", the orphan branch that holds the score history (one file per month under history/).
    required: false
    default: "archy-history"
  history-last:
    description: For "history", how many recent records the job summary shows.
    required: false
    default: "10"
  token:
    description: For "history" with record true, the token that writes the history branch. Needs contents write; the default workflow token works.
    required: false
    default: ${{ github.token }}
  python-version:
    description: Python version to install when running archy.
    required: false
    default: "3.10"

runs:
  using: composite
  steps:
    # Pinned to the same full SHA as this repository's own workflows. A mutable
    # tag lets whoever controls it run code in every consumer's job.
    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        enable-cache: true

    # Inputs reach the shell as ENVIRONMENT VARIABLES, never as `${{ inputs.* }}`
    # inside `run:`. GitHub expands `${{ }}` before the shell parses the script,
    # so a caller passing an untrusted value (a branch name, a PR title) in `path`
    # would otherwise get arbitrary command execution in a job that holds their
    # token. An env var is data to the shell, whatever it contains (#607).
    - name: Set up Python
      shell: bash
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        if [[ ! "$INPUT_PYTHON_VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
          echo "Invalid python-version: $INPUT_PYTHON_VERSION" >&2
          exit 2
        fi
        uv python install "$INPUT_PYTHON_VERSION"

    - name: Install archy
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [[ "$ACTION_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
          uv tool install "archy==${BASH_REMATCH[1]}"
        else
          uv tool install "$ACTION_PATH"
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run archy ${{ inputs.command }}
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_STRICT_TOLERANCE: ${{ inputs.strict-tolerance }}
        INPUT_RECORD: ${{ inputs.record }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_HISTORY_BRANCH: ${{ inputs.history-branch }}
        INPUT_HISTORY_LAST: ${{ inputs.history-last }}
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
        # The token is only handed to the history command, and only then.
        ARCHY_HISTORY_TOKEN: ${{ inputs.command == 'history' && inputs.token || '' }}
      run: |
        set -euo pipefail
        fail() { echo "$1" >&2; exit 2; }
        # A value starting with `-` would be read by archy as an option, which
        # is argument injection even with the shell out of the picture.
        for v in INPUT_PATH INPUT_CONFIG INPUT_BASELINE; do
          [[ "${!v}" == -* ]] && fail "Invalid ${v#INPUT_}: must not start with '-'"
        done
        [[ "$INPUT_STRICT" == "true" || "$INPUT_STRICT" == "false" ]] \
          || fail "Invalid strict: $INPUT_STRICT (expected true or false)"
        [[ "$INPUT_RECORD" == "true" || "$INPUT_RECORD" == "false" ]] \
          || fail "Invalid record: $INPUT_RECORD (expected true or false)"
        [[ "$INPUT_STRICT_TOLERANCE" =~ ^[0-9]+(\.[0-9]+)?$ ]] \
          || fail "Invalid strict-tolerance: $INPUT_STRICT_TOLERANCE"
        [[ "$INPUT_HISTORY_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
          || fail "Invalid history-branch: $INPUT_HISTORY_BRANCH"
        [[ "$INPUT_HISTORY_LAST" =~ ^[1-9][0-9]*$ ]] \
          || fail "Invalid history-last: $INPUT_HISTORY_LAST"
        case "$INPUT_COMMAND" in
          score)
            args=("$INPUT_PATH")
            if [[ "$INPUT_STRICT" == "true" ]]; then
              args+=(--strict --strict-tolerance "$INPUT_STRICT_TOLERANCE")
            fi
            if [[ "$INPUT_RECORD" == "true" ]]; then
              args+=(--record)
            fi
            archy score "${args[@]}"
            ;;
          check)
            args=("$INPUT_PATH")
            if [[ -n "$INPUT_CONFIG" ]]; then
              args+=(--config "$INPUT_CONFIG")
            fi
            archy check "${args[@]}"
            ;;
          cycles)
            args=("$INPUT_PATH")
            if [[ "$INPUT_STRICT" == "true" ]]; then
              args+=(--strict)
            fi
            archy cycles "${args[@]}"
            ;;
          diff)
            args=("$INPUT_PATH" --baseline "$INPUT_BASELINE")
            if [[ "$INPUT_STRICT" == "true" ]]; then
              args+=(--strict)
            fi
            archy diff "${args[@]}"
            ;;
          history)
            args=(--project "$INPUT_PATH" --branch "$INPUT_HISTORY_BRANCH"
                  --last "$INPUT_HISTORY_LAST" --html-out "$RUNNER_TEMP_DIR/archy-trend.html")
            if [[ "$INPUT_RECORD" == "true" ]]; then
              args+=(--record)
            fi
            uv run --no-project --python "$INPUT_PYTHON_VERSION" \
              python "$ACTION_PATH/scripts/archy_history.py" "${args[@]}"
            ;;
          *)
            fail "Unknown command: $INPUT_COMMAND"
            ;;
        esac

    - name: Upload the score trend
      if: inputs.command == 'history'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: archy-score-trend
        path: ${{ runner.temp }}/archy-trend.html
        if-no-files-found: ignore
