repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in sync with the ruff version in uv.lock so pre-commit and CI
    # use the same formatter; an older pre-commit rev silently let two
    # ruff-format-clean-locally / ruff-format-dirty-in-CI commits through #54.
    rev: v0.15.12
    hooks:
      - id: ruff
      - id: ruff-format

  # ty has no upstream pre-commit hook yet; run via uv to mirror CI exactly.
  - repo: local
    hooks:
      - id: ty
        name: ty type-check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/hslee16/archy
    rev: v0.17.0
    hooks:
      - id: archy-check
      - id: archy-cycles
      # archy-score-strict intentionally not enabled here.
      # `.archy/history.jsonl` is gitignored ("per-checkout, not committed"),
      # so there is no shared baseline for the gate to read.
