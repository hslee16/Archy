name: Fresh-install smoke

# Builds the wheel from source and installs it into a clean venv on every
# supported (OS, Python) combination, then exercises the CLI end-to-end via
# `tests/smoke_install.py`. Catches packaging, console-script, and runtime
# import regressions that the unit-test suite does not (the unit suite runs
# from source against the dev environment, not from a built wheel).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel into fresh venv (POSIX)
        if: runner.os != 'Windows'
        run: |
          python -m venv /tmp/archy-smoke-venv
          . /tmp/archy-smoke-venv/bin/activate
          pip install --upgrade pip
          pip install dist/*.whl
          python tests/smoke_install.py

      - name: Install wheel into fresh venv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv $env:RUNNER_TEMP\archy-smoke-venv
          & "$env:RUNNER_TEMP\archy-smoke-venv\Scripts\Activate.ps1"
          pip install --upgrade pip
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          pip install $wheel.FullName
          python tests/smoke_install.py
