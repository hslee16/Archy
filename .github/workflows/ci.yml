name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests
        run: uv run pytest

      - name: Layer rules (archy check)
        uses: ./
        with:
          command: check

      - name: Cycle gate (archy cycles --strict)
        uses: ./
        with:
          command: cycles
          strict: "true"
