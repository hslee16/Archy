name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not tags or branches. A mutable
      # ref lets whoever controls it run arbitrary code in the publish pipeline;
      # that is how LiteLLM and Telnyx were compromised in 2026. Dependabot
      # bumps these and keeps the trailing version comment in sync.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Build sdist and wheel
        run: uv build

      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/archy/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # The registry listing sat at 0.13.3 while archy shipped 0.46.1, because
  # `server.json` was bumped by hand every release and never published: #340
  # added a test that keeps the FILE current and a checklist line, and neither
  # could make the entry reach the registry. This job is the missing half (#462).
  #
  # `needs: publish` because the entry names a PyPI version. Publishing the
  # listing first would advertise a version nobody can install.
  registry:
    name: Publish to MCP registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC proves this repo owns the io.github.hslee16 namespace
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, not `latest`. The comment on the build job applies with equal
      # force to a tarball: a mutable ref lets whoever controls it run arbitrary
      # code in the publish pipeline. Bump this deliberately.
      # The tarball is verified against a committed sha256, because this job holds
      # `id-token: write` and a pinned VERSION still trusts whatever the release
      # asset is at download time. Bump the version and the digest together
      # (`gh api repos/modelcontextprotocol/registry/releases/tags/<v> --jq '.assets[]
      # | select(.name=="mcp-publisher_linux_amd64.tar.gz") | .digest'`) (#607).
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz

      - name: Authenticate to the registry
        run: ./mcp-publisher login github-oidc

      # Publishes server.json as committed. It is already asserted against
      # pyproject.toml by tests/test_server_json.py, which also pins that the
      # published command carries the `mcp` subcommand -- without it the
      # registry hands clients `uvx archy`, which exits 2 and fails the
      # handshake on every platform (#462).
      - name: Publish server.json
        run: ./mcp-publisher publish
