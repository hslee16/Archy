name: Score delta

# Scores a pull request's head and its base with the SAME archy and hands the two
# numbers to `score-comment.yml`, which posts them (#604). This half runs the PR's
# code, so it holds a read-only token and posts nothing: a fork PR's token cannot
# write anyway, and a write token must never sit beside code from a fork.
on:
  pull_request:

permissions:
  contents: read

jobs:
  score-delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit has to be present to score it

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync

      - name: Score the PR head and its base with the same archy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/score"
          uv run archy score . --format json > "$RUNNER_TEMP/score/head.json" || echo '{}' > "$RUNNER_TEMP/score/head.json"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          uv run archy score "$RUNNER_TEMP/base" --format json > "$RUNNER_TEMP/score/base.json" || echo '{}' > "$RUNNER_TEMP/score/base.json"
          echo "$BASE_SHA" > "$RUNNER_TEMP/score/base_sha.txt"

      # No PR number is passed: the table goes to the job summary, and the comment
      # job finds the PR itself from this run's head branch and SHA.
      - name: Show the table in the job summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          uv run --no-project python scripts/archy_score_delta.py \
            "$RUNNER_TEMP/score/base.json" "$RUNNER_TEMP/score/head.json" "$BASE_SHA"

      - name: Hand the scores to the comment workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: score-delta
          path: ${{ runner.temp }}/score/
          retention-days: 1
