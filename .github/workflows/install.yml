name: Installer tests

# Layers 1-4 of docs/SPEC_INSTALL_TESTING.md for the `archy install` registry.
# Layer 5 (real-client E2E) is gated separately in install-e2e.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    # Layers 1 (unit) + 2 (snapshot). Pure renders + mocked detection, so one
    # Linux runner covers all three simulated OSes in well under a minute.
    name: unit + snapshot (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --group dev

      - name: Unit + snapshot tests
        run: uv run pytest tests/install/unit tests/install/snapshot

  cross-os:
    # Layers 3 (filesystem integration) + 4 (contract). Real os.replace, real
    # path resolution, and Windows file-locking must run on each OS itself.
    name: integration + contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --group dev

      - name: Integration + contract tests
        run: uv run pytest tests/install/integration tests/install/contract
