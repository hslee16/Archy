name: Installer E2E (gated)

# Layer 5 of docs/SPEC_INSTALL_TESTING.md: install the real client CLI, run
# `archy install` against it, and confirm the client actually reaches archy.
#
# Gated, not scheduled: it runs on release tags (so we know the install path
# works for the version we are about to publish) and on manual dispatch. No
# cron, by design (see the spec's "Why E2E is gated"). It is excluded from PRs
# because it costs API tokens and needs the client API-key secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.client }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        client: [claude-code, cursor]
        exclude:
          # The official Cursor Agent CLI ships for Linux and macOS only; on
          # Windows it runs through WSL or a community build, neither of which
          # is scriptable here. Cursor is still covered on ubuntu + macos.
          - os: windows-latest
            client: cursor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # No cache in a job that holds API keys: a poisoned entry would run here.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.10

      - name: Install archy
        run: uv sync

      # Both clients are pinned (#607): whatever is installed here runs in the
      # same job as the API keys. Dependabot sees neither pin, so bump by hand.
      - name: Install Claude Code CLI
        if: matrix.client == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code@2.1.323

      - name: Install Cursor CLI
        # An auto-update would replace the pin in the step that holds the key,
        # hence --disable-auto-update below.
        # Cursor is Unix-only in this matrix (the windows-latest x cursor cell
        # is excluded above), so a single bash install step covers it. This
        # replaces `curl https://cursor.com/install | bash`: the version and
        # both checksums come from that script, so bump all three together.
        if: matrix.client == 'cursor'
        shell: bash
        env:
          CURSOR_VERSION: 2026.11.22-e9042b2
          SHA256_LINUX_X64: 7663b1c5d1b56e095ef8e23bef38d66df6cfd665c4873470214e0e411f0f97b3
          SHA256_DARWIN_ARM64: 92f39e448218897538bd801cdb01d69106ab37a86aaf3dc0e6b55159c79b75e2
        run: |
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64) platform=linux/x64 sha=$SHA256_LINUX_X64 ;;
            Darwin/arm64) platform=darwin/arm64 sha=$SHA256_DARWIN_ARM64 ;;
            *) echo "no pinned Cursor CLI for $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o cursor.tar.gz \
            "https://downloads.cursor.com/lab/$CURSOR_VERSION/$platform/agent-cli-package.tar.gz"
          echo "$sha  cursor.tar.gz" | shasum -a 256 -c -
          dest="$HOME/.local/share/cursor-agent/versions/$CURSOR_VERSION"
          mkdir -p "$dest" "$HOME/.local/bin"
          tar --strip-components=1 -xzf cursor.tar.gz -C "$dest"
          rm cursor.tar.gz
          ln -sf "$dest/cursor-agent" "$HOME/.local/bin/cursor-agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run archy install
        run: uv run archy install --target ${{ matrix.client == 'claude-code' && 'claude' || 'cursor' }} --yes

      - name: Assert the written config parses and names archy
        # Always-on assertion: no API key needed. Confirms the install path
        # produced a config the client could load.
        run: uv run python tests/install/e2e_assert_config.py ${{ matrix.client == 'claude-code' && 'claude' || 'cursor' }}

      - name: Headless reachability (Claude Code)
        if: matrix.client == 'claude-code' && env.HAS_ANTHROPIC_KEY == 'true'
        # `bash` on every OS, which also sets pipefail: a failing client fails.
        shell: bash
        run: |
          claude -p "Call the archy_score tool on the current directory and print only the overall number, to three decimal places." \
            --allowedTools "mcp__archy__archy_score" \
            --disallowedTools "Bash,Read,Glob,Grep" 2>&1 | tee out.txt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"

      - name: Headless reachability (Cursor)
        if: matrix.client == 'cursor' && env.HAS_CURSOR_KEY == 'true'
        shell: bash
        run: |
          cursor-agent --disable-auto-update -p "Call the archy_score tool on the current directory and print the overall number, to three decimal places." 2>&1 | tee out.txt
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      # After the client, and outside the checkout: an expected value it could
      # read would pass with no server at all. The client's server is
      # `uvx archy mcp`, so the expectation comes from the same published archy.
      - name: Assert the reply reports the score
        if: >-
          (matrix.client == 'claude-code' && env.HAS_ANTHROPIC_KEY == 'true') ||
          (matrix.client == 'cursor' && env.HAS_CURSOR_KEY == 'true')
        shell: bash
        run: |
          uvx archy score . --format json > "$RUNNER_TEMP/expected.json"
          uv run python tests/install/e2e_assert_score.py "$RUNNER_TEMP/expected.json" out.txt

    # Booleans only: the keys themselves are set on the one step that uses each,
    # so no install step can read them.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_CURSOR_KEY: ${{ secrets.CURSOR_API_KEY != '' }}
