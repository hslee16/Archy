<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>archy architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture &middot; archy</p>
    <h1>What archy is made of</h1>
    <svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archy-arch-title archy-arch-desc">
      <title id="archy-arch-title">archy architecture</title>
      <desc id="archy-arch-desc">Python source is parsed into an import graph, which feeds both the analysis modules and the layer policy declared in archy.yaml, and every result reaches the reader through one shared set of surfaces.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first, so boxes paint over the line ends -->
      <line x1="180" y1="250" x2="412" y2="250" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="272" y="224" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="233" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TREE-SITTER</text>

      <path d="M580,238 H592 A8,8 0 0 0 600,230 V178 A8,8 0 0 1 608,170 H612"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M580,262 H592 A8,8 0 0 1 600,270 V322 A8,8 0 0 0 608,330 H612"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <path d="M800,170 H812 A8,8 0 0 1 820,178 V234 A8,8 0 0 0 828,242 H832"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M800,330 H812 A8,8 0 0 0 820,322 V266 A8,8 0 0 1 828,258 H832"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <line x1="710" y1="422" x2="710" y2="366" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="722" y="388" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="726" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RULES</text>

      <!-- Node: Python source (input treatment) -->
      <rect x="40" y="222" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="222" width="140" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="110" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your source</text>
      <text x="110" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">*.py</text>

      <!-- Node: archy.parser -->
      <rect x="220" y="222" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="222" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">archy.parser</text>
      <text x="300" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">imports, not text</text>

      <!-- Node: archy.graph (FOCAL) -->
      <rect x="420" y="222" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="222" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="500" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">archy.graph</text>
      <text x="500" y="264" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the import graph</text>

      <!-- Node: analysis modules (aggregate) -->
      <rect x="620" y="142" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="142" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="710" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">analysis modules</text>
      <text x="710" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">score, cycles, dsm, and the rest</text>

      <!-- Node: archy.layers -->
      <rect x="620" y="302" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="302" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="710" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">archy.layers</text>
      <text x="710" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">declared, not inferred</text>

      <!-- Node: archy.yaml (input treatment) -->
      <rect x="620" y="422" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="422" width="180" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="710" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">archy.yaml</text>
      <text x="710" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">your intent</text>

      <!-- Node: surfaces -->
      <rect x="840" y="222" width="180" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="840" y="222" width="180" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="930" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">surfaces</text>
      <text x="930" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">text &#183; --format json</text>
      <text x="930" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MCP payload</text>

      <!-- Legend strip -->
      <line x1="40" y1="504" x2="1080" y2="504" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="140" y="512" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
      <text x="162" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">YOU SUPPLY</text>
      <rect x="300" y="512" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="322" y="520" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ARCHY DERIVES</text>

      <text x="40" y="544" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Everything downstream is a read of one import graph. The rules are the only part archy cannot derive, which is why they are a file you write.</text>
    </svg>
  </div>
</body>
</html>
