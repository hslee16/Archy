<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import cycle</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph &middot; archy</p>
    <h1>Import cycle</h1>
    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archy-cycles-title archy-cycles-desc">
      <title id="archy-cycles-title">Import cycle</title>
      <desc id="archy-cycles-desc">Dependency graph of three modules where pkg.a imports pkg.b, pkg.b imports pkg.c, and pkg.c imports pkg.a, closing a cycle that archy cycles --strict fails on.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Rank column (left margin) -->
      <text x="80" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RANK 0</text>
      <text x="80" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RANK 1</text>
      <text x="80" y="340" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">RANK 2</text>

      <!-- Arrows drawn before boxes -->
      <!-- Forward edge a -> b (shares x, so a straight line is allowed) -->
      <line x1="500" y1="144" x2="500" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Forward edge b -> c -->
      <line x1="500" y1="264" x2="500" y2="316" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- THE CYCLE: c -> a, routed around the outside of the node stack -->
      <path d="M580,344 H656 A8,8 0 0 0 664,336 V124 A8,8 0 0 0 656,116 H580"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="676" y="220" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="678" y="229" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" font-weight="600">CYCLE</text>

      <!-- Node: pkg.a (rank 0) -->
      <rect x="420" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="94" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="554" y="103" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 in</text>
      <text x="480" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pkg.a</text>

      <!-- Node: pkg.b (rank 1) -->
      <rect x="420" y="208" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="208" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="214" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="554" y="223" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 in</text>
      <text x="480" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pkg.b</text>

      <!-- Node: pkg.c (rank 2) -->
      <rect x="420" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="334" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="554" y="343" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 in</text>
      <text x="480" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pkg.c</text>

      <!-- Legend strip -->
      <line x1="120" y1="440" x2="960" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="120" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="220" y1="452" x2="252" y2="452" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">IMPORTS (FORWARD)</text>
      <line x1="480" y1="452" x2="512" y2="452" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="520" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">BACK-EDGE THAT CLOSES THE CYCLE</text>

      <text x="120" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Ranks make the cycle legible: every forward edge points down, so the one edge pointing up is the whole finding.</text>
    </svg>
  </div>
</body>
</html>
