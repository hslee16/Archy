<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transitive violation</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency graph &#183; archy</p>
    <h1>The violation with no forbidden import</h1>
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archy-transitive-title archy-transitive-desc">
      <title id="archy-transitive-title">The violation with no forbidden import</title>
      <desc id="archy-transitive-desc">The store layer imports the common layer and common imports the api layer, each permitted on its own, but together they let store reach api, which the rules forbid; no single import in the diff breaks a rule.</desc>

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows before boxes -->
      <line x1="500" y1="144" x2="500" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="516" y="158" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="167" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ALLOWED</text>

      <line x1="500" y1="264" x2="500" y2="316" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="516" y="278" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="520" y="287" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">ALLOWED</text>

      <!-- The forbidden reach: no such edge exists, it is the composition -->
      <path d="M580,116 H656 A8,8 0 0 1 664,124 V348 A8,8 0 0 1 656,356 H584"
            fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="676" y="218" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text x="678" y="227" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" font-weight="600">FORBIDDEN REACH</text>

      <!-- store -->
      <rect x="420" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="94" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="554" y="103" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">0 in</text>
      <text x="480" y="118" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">store</text>
      <text x="480" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repository.py</text>

      <!-- common -->
      <rect x="420" y="208" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="208" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="214" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="554" y="223" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 in</text>
      <text x="480" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">common</text>
      <text x="480" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tenancy.py</text>

      <!-- api -->
      <rect x="420" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="334" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="554" y="343" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1 in</text>
      <text x="480" y="358" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">api</text>
      <text x="480" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">context.py</text>

      <!-- Legend strip -->
      <line x1="120" y1="440" x2="880" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="120" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="220" y1="452" x2="252" y2="452" stroke="#4f5d75" stroke-width="1"/>
      <text x="260" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">A REAL IMPORT, PERMITTED</text>
      <line x1="500" y1="452" x2="532" y2="452" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="540" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NOT AN IMPORT: THE REACH THEY COMPOSE</text>

      <text x="120" y="484" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">The dashed arrow is the violation, and no file contains it. Every solid edge is legal on its own, which is why reading the diff, or the config, tells you nothing.</text>
    </svg>
  </div>
</body>
</html>
