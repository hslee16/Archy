# Benchmark project manifest for archy.
#
# Used by `bench/run.py` to clone, pin, and analyze a curated set of
# Python projects. SHAs are pinned so benchmark numbers in `docs/SCORING.md`
# and `docs/research/RESEARCH_METRICS.md` stay reproducible.
#
# To refresh SHAs: edit by hand or run `bench/run.py --update-shas`.
# To add a project: append below with a one-line `why` rationale so the
# diversity claim stays auditable.

# Last SHA refresh: 2026-06-18.

projects:
  # --- 9-library popular set (preserved from prior benchmarks) -------------
  - name: starlette
    repo: encode/starlette
    sha: "de970d7"
    src_dir: starlette
    why: small async web framework

  - name: httpx
    repo: encode/httpx
    sha: "b5addb6"
    src_dir: httpx
    why: async HTTP client

  - name: click
    repo: pallets/click
    sha: "8a1b1a3"
    src_dir: src/click
    why: CLI framework

  - name: rich
    repo: Textualize/rich
    sha: "46cebbb"
    src_dir: rich
    why: terminal rendering

  - name: flask
