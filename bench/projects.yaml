  - name: fastapi
    repo: fastapi/fastapi
    sha: "e89a37e"
    src_dir: fastapi
    why: layered web framework on starlette

  # --- size and domain coverage --------------------------------------------
  - name: django
    repo: django/django
    sha: "4d455ae"
    src_dir: django
    why: very large web framework, app-plugin pattern, older codebase

  - name: sqlalchemy
    repo: sqlalchemy/sqlalchemy
    sha: "1e1c008"
    src_dir: lib/sqlalchemy
    why: very large ORM, deep inheritance, dialect plugins

  - name: scrapy
    repo: scrapy/scrapy
    sha: "5223dbe"
    src_dir: scrapy
    why: signals/middleware/pipeline plugin patterns

  - name: scikit-learn
    repo: scikit-learn/scikit-learn
    sha: "13f20d7"
    src_dir: sklearn
    why: scientific, distinctive estimator/transformer pattern

  - name: numpy
    repo: numpy/numpy
    sha: "0a1ed72"
    src_dir: numpy
    why: namespace package, mostly C with Python orchestration

  # --- async / modern-typed ------------------------------------------------
  - name: aiohttp
    repo: aio-libs/aiohttp
    sha: "e8f4371"
    src_dir: aiohttp
    why: async web (server + client)

  - name: anyio
    repo: agronholm/anyio
    sha: "bcb2db6"
    src_dir: src/anyio
    why: small, modern-typed async-abstraction layer

  - name: msgspec
    repo: jcrist/msgspec
    sha: "3b2543b"
    src_dir: src/msgspec
    why: pydantic alternative, smaller surface

  # --- plugin host / orchestration -----------------------------------------
  - name: datasette
    repo: simonw/datasette
    sha: "aa84fe0"
    src_dir: datasette
    why: pluggy host where plugins dominate the surface

  - name: mkdocs
