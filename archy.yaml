# archy's own layer rules - enforced in CI via `archy check .`.
#
# The intent is a pure dependency tree:
#   parser  →  (nothing internal)
#   graph   →  parser
#   policy  →  graph
#   cli     →  parser, graph, policy
#
# Lower layers must not depend on higher ones.

layers:
  parser:
    modules:
      - "archy.parser"
  graph:
    modules:
      - "archy.graph"
      - "archy.cycles"
      - "archy.score"
      - "archy.history"
      - "archy.trend"
  policy:
    modules:
      - "archy.layers"
  cli:
    modules:
      - "archy.cli"
      - "archy.mcp"

forbid:
  - {from: parser, to: graph}
  - {from: parser, to: policy}
  - {from: parser, to: cli}
  - {from: graph,  to: policy}
  - {from: graph,  to: cli}
  - {from: policy, to: cli}

# Directories archy must not descend into. `replay_cache/` holds the vendored
# git clones created by `bench/inloop_prevalence.py` (full external repos checked
# out at arbitrary commits); scoring them would pollute archy's self-score and
# races with the harness's concurrent `git checkout`s (FileNotFoundError on files
# that vanish mid-scan). Matched by basename, so any nested `replay_cache/` is
# skipped. Harmless in CI, where the directory does not exist.
exclude:
  - replay_cache
