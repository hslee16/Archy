# archy's own layer rules - enforced in CI via `archy check .`.
#
# The intent is a pure dependency tree, bottom to top:
#   metrics   leaf measurements (reach, instability, risk, entrypoints, gitlog, dsm)
#   parser    tree-sitter parse + per-function complexity
#   graph     the import graph and what is computed straight from it
#   policy    layer rules (archy.layers)
#   analysis  features built on the graph and policy (diff, impact, simulate, ...)
#   cli       the two front ends (CLI, MCP) and their glue
#   install   the agent-config installer; imported only by the CLI
#
# Lower layers must not depend on higher ones. `metrics` is the lowest layer
# and `parser` may import it, so `parser -> metrics` is deliberately not forbidden.
#
# The root `archy` module (`__init__`, which holds `__version__`) is left out on
# purpose: import-linter treats it as the parent of every other module, so a
# layer containing it makes the transitive contracts underivable ("Modules have
# shared descendants").

layers:
  metrics:
    modules:
      - "archy.dsm"
      - "archy.entrypoints"
      - "archy.gitlog"
      - "archy.instability"
      - "archy.reach"
      - "archy.risk"
  parser:
    modules:
      - "archy.parser"
      - "archy.complexity"
  graph:
    modules:
      - "archy.graph"
      - "archy.graph_assemble"
      - "archy.graph_discovery"
      - "archy.graph_hints"
      - "archy.graph_models"
      - "archy.graph_resolve"
      - "archy.cycles"
      - "archy.score"
      - "archy.history"
      - "archy.trend"
      - "archy.index"
  policy:
    modules:
      - "archy.layers"
      - "archy.layers_check"
      - "archy.layers_config"
      - "archy.layers_match"
      - "archy.layers_models"
  analysis:
    modules:
      - "archy.affected"
      - "archy.conventions"
      - "archy.conventions_collect"
      - "archy.conventions_docs"
      - "archy.conventions_families"
      - "archy.conventions_gates"
      - "archy.conventions_models"
      - "archy.contracts"
      - "archy.coupling"
      - "archy.diff"
      - "archy.diff_summary"
      - "archy.duplicates"
      - "archy.headers"
      - "archy.hotspots"
      - "archy.impact"
      - "archy.ratchet"
      - "archy.refactor"
      - "archy.simulate"
      - "archy.watcher"
  cli:
    modules:
      - "archy.cli"
      - "archy.cli_app"
      - "archy.cli_check"
      - "archy.cli_conventions"
      - "archy.cli_git"
      - "archy.cli_graph"
      - "archy.cli_history"
      - "archy.cli_install"
      - "archy.cli_render"
      - "archy.cli_render_check"
      - "archy.cli_render_common"
      - "archy.cli_render_conventions"
      - "archy.cli_render_git"
      - "archy.cli_render_graph"
      - "archy.cli_render_history"
      - "archy.mcp"
      - "archy.mcp_compat"
      - "archy.mcp_payloads"
      - "archy.mcp_runs"
      - "archy.mcp_runs_check"
      - "archy.mcp_runs_core"
      - "archy.mcp_runs_git"
      - "archy.mcp_runs_graph"
      - "archy.render"
      - "archy.scan_config"
  install:
    modules:
      - "archy.install.**"

forbid:
  - {from: metrics,  to: parser}
  - {from: metrics,  to: graph}
  - {from: metrics,  to: policy}
  - {from: metrics,  to: analysis}
  - {from: metrics,  to: cli}
  - {from: metrics,  to: install}
  - {from: parser,   to: graph}
  - {from: parser,   to: policy}
  - {from: parser,   to: analysis}
  - {from: parser,   to: cli}
  - {from: parser,   to: install}
  - {from: graph,    to: policy}
  - {from: graph,    to: analysis}
  - {from: graph,    to: cli}
  - {from: graph,    to: install}
  - {from: policy,   to: analysis}
  - {from: policy,   to: cli}
  - {from: policy,   to: install}
  - {from: analysis, to: cli}
  - {from: analysis, to: install}
  - {from: install,  to: metrics}
  - {from: install,  to: parser}
  - {from: install,  to: graph}
  - {from: install,  to: policy}
  - {from: install,  to: analysis}
  - {from: install,  to: cli}

# Directories archy must not descend into -- all hold vendored external git
# clones created by the bench harness, gitignored and absent in CI:
#   replay_cache/ -- `bench/inloop_prevalence.py` checkouts at arbitrary commits
#   repo_cache/   -- `bench/run.py` clone cache (moved in-repo in #212)
#   cache/        -- misc bench scratch
# Scoring them pollutes archy's self-score and spins for minutes on the ~40k
# vendored `.py` files, and races the harness's concurrent `git checkout`s
# (FileNotFoundError on files that vanish mid-scan). Matched by basename, so any
# nested copy is skipped. Harmless in CI, where the directories do not exist.
exclude:
  - replay_cache
  - repo_cache
  - cache
  # Sample source trees for the benches, not archy code. `conduit_clean/violating`
  # deliberately contains an upward import, which forms a genuine 3-module cycle
  # (routes -> services -> repositories -> routes). archy's own `cycles --strict`
  # CI gate found it immediately, which is the gate working correctly on a tree
  # that is supposed to be broken.
  - fixtures
